[workspace]
resolver = "3"
members = ["crates/core", "crates/app"]

[workspace.package]
version = "0.2.2"
edition = "2024"
rust-version = "1.91"
license = "MIT"
repository = "https://github.com/qarlus/kite"

# Versions are pinned here once. Crates use `dep = { workspace = true }`.
[workspace.dependencies]
kite-core = { path = "crates/core" }
anyhow = "1"
async-channel = "2"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
gpui-kit = "=0.7.3"
# Blitz defaults pull duplicate usvg/accesskit and ICU/WOFF code that mail rendering never uses.
blitz-dom = { version = "=0.3.0-beta.4", default-features = false, features = ["system-fonts"] }
blitz-html = "=0.3.0-beta.4"
blitz-paint = { version = "=0.3.0-beta.4", default-features = false }
blitz-traits = "=0.3.0-beta.4"
anyrender = "0.14"
anyrender_vello_cpu = "0.18"
image = { version = "0.25", default-features = false }
# kite-core network stack. TLS is always the OS stack (native-tls), never rustls.
tokio = { version = "1", default-features = false }
reqwest = { version = "0.13", default-features = false, features = ["form", "json", "native-tls", "stream"] }
mail-parser = { version = "0.11", default-features = false }
mail-builder = { version = "1", default-features = false }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
keyring = { version = "3", default-features = false, features = ["apple-native", "windows-native"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
sha2 = "0.10"
minisign-verify = "=0.2.5"
base64 = "0.22"
getrandom = { version = "0.3", features = ["std"] }
# Native Proton API: SRP (bcrypt + the big-int crate rpgp already links) and OpenPGP bodies.
bcrypt = { version = "0.19", default-features = false, features = ["std"] }
num-bigint-dig = { version = "0.8", default-features = false, features = ["std"] }
pgp = { version = "0.21", default-features = false }
rand = { version = "0.8", default-features = false, features = ["std", "std_rng"] }

[profile.dev]
debug = "line-tables-only"

# Optimise dependencies in dev: Blitz/Stylo and SQLite are unusably slow at opt-level 0.
# Costs once on a clean build; incremental builds only recompile our crates.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# Fast-building stand-in for release when iterating on perf budgets: thin LTO over
# parallel codegen units builds several times faster than fat LTO with 1 unit.
# Ship and measure the size budget with `release` only.
[profile.perf]
inherits = "release"
lto = "thin"
codegen-units = 16
