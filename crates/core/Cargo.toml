[package]
name = "kite-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
anyhow.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
async-channel = "2"
tokio = { workspace = true, features = ["net", "io-util", "time", "rt", "macros"] }
reqwest.workspace = true
mail-parser.workspace = true
mail-builder.workspace = true
chrono.workspace = true
keyring.workspace = true
futures-util.workspace = true
sha2.workspace = true
base64.workspace = true
getrandom.workspace = true
# Native Proton Mail (API, not Bridge): SRP login and OpenPGP message bodies.
bcrypt.workspace = true
num-bigint-dig.workspace = true
pgp.workspace = true
rand.workspace = true

[dev-dependencies]
# Fake Graph/Proton HTTP servers and `#[tokio::test]` need a runtime.
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync"] }
