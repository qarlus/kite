[package]
name = "kite-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
anyhow.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
async-channel = "2"
tokio = { workspace = true, features = ["net", "io-util", "time", "rt", "macros"] }
reqwest.workspace = true
native-tls.workspace = true
tokio-native-tls.workspace = true
async-imap.workspace = true
mail-parser.workspace = true
mail-builder.workspace = true
chrono.workspace = true
keyring.workspace = true
futures-util.workspace = true
sha2.workspace = true
base64.workspace = true
getrandom.workspace = true
aes-gcm.workspace = true
rmp-serde.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = ["Win32_Foundation", "Win32_Security_Credentials"] }

[dev-dependencies]
# Fake Graph/IMAP/SMTP servers and `#[tokio::test]` need a runtime.
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync"] }
